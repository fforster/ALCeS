[pytest]
# Los tests del repo nacieron como scripts (`python tests/test_x.py`) con un
# contador global `_fail`; conftest.py los adapta a pytest sin reescribirlos.
testpaths = tests exploration/lightcurvelynx
python_files = test_*.py
markers =
    nlhpc: necesita datos reales de NLHPC (SED de SNANA, OpSim) -- se salta en CI

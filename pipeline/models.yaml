# ============================================================================
# models.yaml — Catalogo de modelos de transientes para SNANA
# ----------------------------------------------------------------------------
# MODO PRINCIPAL: 'simgen_include' — ruta a un SIMGEN_INCLUDE_*.INPUT YA
# CURADO. El compilador de la Capa 2 hace un passthrough (INPUT_FILE_INCLUDE)
# a ese archivo: no reinventamos DNDZ, pesos por plantilla NON1A, ni rangos —
# eso ya esta afinado por el autor original de cada SIMGEN_INCLUDE.
#
# Rutas portables (Fase 94): ${ALCES_DATA} es la carpeta compartida del equipo
# con run_SNANA/ y OTMODEL_NON1ASED/ (ver INSTALL.md). La expande el
# compilador; si no esta exportada cae a $HOME (la cuenta original).
#
# Rutas verificadas contra:
#   - listado real por SSH de ${ALCES_DATA}/run_SNANA/{model_config,elastic,plasticc_models}
#   - arbol del repo github.com/mauriciovalenzuela742/Light-curves-Simulations-Vera-Rubin
#   - contenido real de SIMGEN_INCLUDE_VC25_SNIbc.INPUT (confirma PATH_NON1ASED,
#     no PATH_SNDATA_SIM como se asumio antes)
#
# Tres ubicaciones distintas de SIMGEN_INCLUDE:
#   BASE_MC      = ${ALCES_DATA}/run_SNANA/model_config          (canonico, 34 archivos)
#   BASE_ELASTIC = ${ALCES_DATA}/run_SNANA/elastic/model_config  (variantes NON1ASED en desarrollo)
#   BASE_OT      = ${ALCES_DATA}/OTMODEL_NON1ASED/SNtypes        (modelos VC25, transporte optico)
#
# MODO FALLBACK: 'genmodel'+'dndz'+'zrange'+'trest' (sin simgen_include) para
# clases sin un SIMGEN_INCLUDE curado todavia. Ver templates.py: PATH_NON1ASED
# confirmado para NON1ASED; PATH_SIMSED para SIMSED es best-effort (SIN
# confirmar contra un archivo real de este proyecto).
# ============================================================================

# ------------------------------------------------------------------
# PLAsTiCC / estándar  (BASE_MC = ${ALCES_DATA}/run_SNANA/model_config)
# ------------------------------------------------------------------
SNIa:
  simgen_include: "${ALCES_DATA}/run_SNANA/model_config/SIMGEN_INCLUDE_SNIa-SALT2.INPUT"
  sim_category: Ia   # unico modelo SALT2 del catalogo; submit_batch_jobs.sh
                      # lo necesita en SIMGEN_INFILE_SNIa (no NONIa). Todos
                      # los demas modelos (NON1ASED/SIMSED/LCLIB) van en NONIa
                      # por defecto — no hace falta declarar sim_category ahi.
  ngen_wfd: 200000   # NGENTOT_LC real (DATASIM_LSST/WFD)
  ngen_ddf: 2000   # NGENTOT_LC real (DATASIM_LSST/DDF)

